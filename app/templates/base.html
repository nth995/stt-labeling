<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}STT Labeling{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">STT</span><span>Labeling Tool</span></div>
    {% if user is defined and user %}
    <div class="header-right">
      {% if user.role == "admin" %}
      <a class="nav-link" href="/admin">Tài khoản</a>
      <a class="nav-link" href="/admin/datasets">Datasets</a>
      {% endif %}
      <span class="muted">{{ user.username }} · {{ 'Quản trị' if user.role == 'admin' else 'Gán nhãn' }}</span>
      <form action="/logout" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="btn secondary" type="submit">Đăng xuất</button>
      </form>
    </div>
    {% endif %}
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
{% if user is defined and user %}
<script>
(() => {
  // Một heartbeat cho toàn bộ phiên, kể cả khi người dùng chuyển sang Workspace.
  // Nếu đóng tất cả tab hoặc mất mạng, server sẽ ngừng nhận tín hiệu này.
  const token = {{ csrf_token|tojson }};
  setInterval(() => {
    fetch('/session-heartbeat', {
      method: 'POST', headers: {'X-CSRF-Token': token}, credentials: 'same-origin'
    }).catch(() => {});
  }, 30000);
})();
</script>
{% endif %}
</body>
</html>
